name: Keep bot warm
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          test -n "$RENDER_URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 "$RENDER_URL/healthz"
